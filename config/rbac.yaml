---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-injector
---
# Role in hosting cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-injector
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["webhook-certs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-injector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webhook-injector
subjects:
  - kind: ServiceAccount
    name: webhook-injector
---
# ClusterRole in the hosting cluster (only needed when --managed-resource-label is set).
# Grants the controller access to Gardener ManagedResources across all namespaces
# and to the resource Secrets they reference.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-injector-hosting
rules:
  - apiGroups: ["resources.gardener.cloud"]
    resources: ["managedresources"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-injector-hosting
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webhook-injector-hosting
subjects:
  - kind: ServiceAccount
    name: webhook-injector
---
# ClusterRole in target cluster (apply separately if remote). Grants the
# ConfigMap mode reconciler permission to author MWC and VWC on the target
# cluster. CRDs are intentionally NOT listed — they flow through Gardener
# ManagedResources on the hosting cluster, not directly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-injector-target
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-injector-target
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webhook-injector-target
subjects:
  - kind: ServiceAccount
    name: webhook-injector
