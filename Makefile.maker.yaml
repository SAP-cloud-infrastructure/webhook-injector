metadata:
  url: https://github.com/SAP-cloud-infrastructure/webhook-injector

binaries:
  - name: webhook-injector
    fromPackage: ./cmd/webhook-injector
    installTo: bin/

controllerGen:
  enabled: false

dockerfile:
  enabled: true
  entrypoint: [ "/usr/bin/webhook-injector" ]
  extraIgnores:
    - /_scratch
  useBuildKit: true

githubWorkflow:
  global:
    defaultBranch: main
    goVersion: 1.26.5
  ci:
    enabled: true
    prepareMakeTarget: install-skaffold
    runOn:
      - ubuntu-latest
    ignorePaths:
      - "**.md" # all Markdown files
  pushContainerToGhcr:
    enabled: true
    platforms: "linux/amd64"
    tagStrategy:
      - edge
      - latest
      - semver
      - sha
  license:
    enabled: true

golang:
  enableVendoring: false
  setGoModVersion: true

golangciLint:
  createConfig: true
  timeout: 3m

renovate:
  enabled: true

reuse:
  annotations:
  - SPDX-FileCopyrightText: SAP SE or an SAP affiliate company and Gardener contributors
    SPDX-License-Identifier: Apache-2.0
    paths:
    - .github/**
    - .gitignore
    - .dockerignore
    - .golangci.yml
    - .license-scan-overrides.jsonl
    - .license-scan-rules.json
    - Makefile
    - PROJECT
    - go.mod
    - go.sum
    - config/**
    - dist/**
    - docs/**
    - hack/**

shellCheck:
  ignorePaths:
    - _scratch/*
  opts: '--external-sources'

testPackages:
  except: test/integration

verbatim: |
  check: test-e2e

  .PHONY: test-e2e
  test-e2e: FORCE
    @printf "\e[1;36m>> Running E2E tests\e[0m\n"
    cd test/e2e && go test -v -timeout 10m ./...

  .PHONY: e2e-setup
  e2e-setup: FORCE
    @printf "\e[1;36m>> Setting up E2E environment\e[0m\n"
    cd test/e2e && ./setup.sh

  .PHONY: e2e-dev
  e2e-dev: e2e-setup
    @printf "\e[1;36m>> Starting Skaffold dev mode\e[0m\n"
    cd test/e2e && skaffold dev

  .PHONY: e2e-teardown
  e2e-teardown: FORCE
    @printf "\e[1;36m>> Tearing down E2E environment\e[0m\n"
    cd test/e2e && ./teardown.sh

  install-skaffold: FORCE
    @if ! hash skaffold 2>/dev/null; then printf "\e[1;36m>> Installing skaffold (this may take a while)...\e[0m\n"; curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 && sudo install skaffold /usr/local/bin/; rm skaffold; fi
