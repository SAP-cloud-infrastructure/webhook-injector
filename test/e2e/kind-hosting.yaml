kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hosting
nodes:
  - role: control-plane
    extraPortMappings:
      # Map NodePort for webhook service so target cluster can reach it
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
  - role: worker
    # Additional worker for pod anti-affinity testing
