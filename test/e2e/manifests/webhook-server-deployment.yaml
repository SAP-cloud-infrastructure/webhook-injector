---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-server
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webhook-server
  template:
    metadata:
      labels:
        app: webhook-server
    spec:
      serviceAccountName: webhook-injector
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: webhook-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: webhook-server
          image: test-webhook-server  # Replaced by ko
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8082
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/webhook-certs
              readOnly: true

        - name: webhook-injector
          image: webhook-injector  # Replaced by ko
          env:
            - name: WEBHOOK_CONFIG_NAME
              value: webhook-config
            - name: WEBHOOK_CONFIG_NAMESPACE
              value: default
            - name: CERT_SECRET_NAMESPACE
              value: default
            - name: CERT_VALIDITY
              value: "60s"  # Short validity for testing
            - name: CERT_ROTATION_THRESHOLD
              value: "0.5"
            - name: TARGET_KUBECONFIG
              value: /etc/target-kubeconfig/kubeconfig
            - name: ENABLE_LEADER_ELECTION
              value: "true"
            - name: LEADER_ELECTION_NAMESPACE
              value: default
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/webhook-certs
            - name: target-kubeconfig
              mountPath: /etc/target-kubeconfig
              readOnly: true

      volumes:
        - name: webhook-certs
          emptyDir: {}
        - name: target-kubeconfig
          secret:
            secretName: target-kubeconfig
