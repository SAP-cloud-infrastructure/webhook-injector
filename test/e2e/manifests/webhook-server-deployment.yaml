---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-server
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webhook-server
  template:
    metadata:
      labels:
        app: webhook-server
    spec:
      serviceAccountName: webhook-injector
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: webhook-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: webhook-server
          image: test-webhook-server  # Replaced by ko
          ports:
            - containerPort: 9443
              name: webhook
            - containerPort: 8084
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8084
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/webhook-certs
              readOnly: true

        - name: webhook-injector
          image: webhook-injector  # Replaced by ko
          args:
            - --webhook-config-name=webhook-config
            - --namespace=default
            - --cert-validity=1h
            - --cert-rotation-threshold=0.5
            - --target-kubeconfig=/etc/target-kubeconfig/kubeconfig
            - --enable-leader-election=true
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/webhook-certs
            - name: target-kubeconfig
              mountPath: /etc/target-kubeconfig
              readOnly: true

      volumes:
        - name: webhook-certs
          emptyDir: {}
        - name: target-kubeconfig
          secret:
            secretName: target-kubeconfig
