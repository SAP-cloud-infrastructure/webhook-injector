---
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: webhook-server
  ports:
    - port: 9443
      targetPort: 9443
      nodePort: 30443
      protocol: TCP
