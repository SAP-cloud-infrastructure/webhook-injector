apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: webhook-injector-e2e

build:
  artifacts:
    - image: webhook-injector
      ko:
        main: github.com/sap-cloud-infrastructure/webhook-injector/cmd/webhook-injector
        dir: ../..
        dependencies:
          paths:
            - ../../pkg/controllers
            - ../../pkg/certificates
            - ../../pkg/webhooks
            - ../../cmd/webhook-injector
    - image: test-webhook-server
      ko:
        main: ./webhook-server
        dependencies:
          paths:
            - ./webhook-server
  local:
    push: false
    useDockerCLI: true

deploy:
  kubeContext: kind-hosting
  kubectl:
    defaultNamespace: default
    manifests:
      - manifests/rbac.yaml
      - manifests/service.yaml
      - manifests/webhook-server-deployment.yaml
      - manifests/webhook-config-rendered.yaml

portForward:
  - resourceType: service
    resourceName: webhook-service
    namespace: default
    port: 9443
    localPort: 9443

profiles:
  - name: dev
    activation:
      - command: dev
    deploy:
      kubectl:
        defaultNamespace: default
