<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6d28d9"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="750" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111">webhook-injector — deployment shape on a Gardener seed</text>
  <text x="750" y="62" text-anchor="middle" font-size="13" fill="#666">native sidecar init-container · shared emptyDir · shoot apiserver and seed namespace co-located</text>

  <!-- =========================================================
       Three rows inside one namespace box:
         Row 1 (top, y=170..530):    Pod webhook-server  ||  Pod apiserver
         Row 2 (mid, y=560..700):    Cert Secret · ConfigMap · MR Secrets · Service
         Row 3 (bot, y=730..880):    Pod GRM (left half)        +  notes (right half)
       Reserved corridors:
         - x=720..760 between the two top Pods (Service column anchors here)
         - y=540..555 between row 1 and row 2 (horizontal corridor)
         - y=710..720 between row 2 and row 3 (horizontal corridor)
       ========================================================= -->

  <!-- ===== SEED CONTROL-PLANE NAMESPACE ===== -->
  <rect x="30" y="90" width="1440" height="810" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="50" y="120" font-size="17" font-weight="700" fill="#1d4ed8">Seed cluster — shoot control-plane namespace</text>
  <text x="50" y="138" font-size="11" fill="#1d4ed8">all Pods, Secrets, ConfigMaps, ManagedResources below live in the SAME namespace</text>

  <!-- ===== ROW 1 LEFT: webhook-server Pod ===== -->
  <rect x="60" y="170" width="640" height="360" rx="14" fill="#fff" stroke="#374151" stroke-width="2.5"/>
  <text x="380" y="198" text-anchor="middle" font-size="15" font-weight="700">Pod: webhook-server</text>
  <text x="380" y="216" text-anchor="middle" font-size="10" fill="#666">Kubernetes 1.29+ native sidecar pattern</text>

  <!-- init container (sidecar) -->
  <rect x="80" y="240" width="280" height="220" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="220" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">init container</text>
  <text x="220" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">webhook-injector</text>
  <text x="220" y="302" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">restartPolicy: Always</text>
  <text x="92" y="328" font-size="11" fill="#222">• WebhookReconciler</text>
  <text x="92" y="346" font-size="11" fill="#222">• ManagedResourceReconciler</text>
  <text x="92" y="364" font-size="11" fill="#222">• CertificateReloader</text>
  <text x="92" y="392" font-size="10" fill="#666" font-style="italic">leader-elected; reloader runs</text>
  <text x="92" y="406" font-size="10" fill="#666" font-style="italic">on every replica</text>
  <text x="92" y="430" font-size="10" fill="#1d4ed8">starts BEFORE main container</text>
  <text x="92" y="448" font-size="10" fill="#1d4ed8">terminates AFTER it</text>

  <!-- main container -->
  <rect x="380" y="240" width="300" height="220" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="530" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">main container</text>
  <text x="530" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">webhook-server</text>
  <text x="530" y="302" text-anchor="middle" font-size="10" fill="#666" font-style="italic">user's webhook code</text>
  <text x="392" y="328" font-size="11" fill="#222">• Serves HTTPS on :443</text>
  <text x="392" y="346" font-size="11" fill="#222">• Watches cert files</text>
  <text x="392" y="362" font-size="11" fill="#222">  (fsnotify / certwatcher)</text>
  <text x="392" y="380" font-size="11" fill="#222">• Reloads on change</text>
  <text x="392" y="406" font-size="10" fill="#666" font-style="italic">controller-runtime v0.17+</text>
  <text x="392" y="420" font-size="10" fill="#666" font-style="italic">handles fsnotify automatically</text>

  <!-- emptyDir volume — narrow box sitting BETWEEN the two containers,
       at x=362..378 (in the inter-container gap), top-to-bottom of the
       container row. Keeps a clear horizontal corridor at y=475..520
       across the rest of the Pod for arrow routing. -->
  <rect x="361" y="245" width="18" height="210" rx="4" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="370" y="465" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309" transform="rotate(-90 370 465)">emptyDir /tmp/webhook-certs</text>

  <!-- init container → emptyDir (writes): horizontal at y=350 -->
  <line x1="360" y1="350" x2="378" y2="350" stroke="#b45309" stroke-width="2" marker-end="url(#arr-o)"/>

  <!-- emptyDir → main container (reads): horizontal at y=380 going west-to-east -->
  <line x1="378" y1="380" x2="392" y2="380" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- emptyDir contents label (small annotation outside the rect, below the Pod) -->
  <text x="370" y="540" text-anchor="middle" font-size="9" fill="#666" font-family="monospace">tls.crt · tls.key</text>

  <!-- ===== ROW 1 RIGHT: shoot apiserver Pod ===== -->
  <rect x="780" y="170" width="660" height="360" rx="14" fill="#fff" stroke="#15803d" stroke-width="2.5"/>
  <text x="1110" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Pod: shoot kube-apiserver</text>
  <text x="1110" y="216" text-anchor="middle" font-size="10" fill="#666">runs as a Pod in this same namespace · its API surface IS the shoot's control plane</text>

  <!-- MWC -->
  <rect x="800" y="240" width="290" height="100" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="945" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">MutatingWebhookConfiguration</text>
  <text x="945" y="279" text-anchor="middle" font-size="9" fill="#666">cluster-scoped on the shoot</text>
  <text x="812" y="300" font-size="9" font-family="monospace">.caBundle  ← from cert Secret</text>
  <text x="812" y="316" font-size="9" font-family="monospace">.url       ← --external-host:port</text>
  <text x="812" y="332" font-size="9" fill="#666" font-style="italic">applied directly by WebhookReconciler</text>

  <!-- VWC -->
  <rect x="1130" y="240" width="290" height="100" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1275" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">ValidatingWebhookConfiguration</text>
  <text x="1275" y="279" text-anchor="middle" font-size="9" fill="#666">cluster-scoped on the shoot</text>
  <text x="1142" y="300" font-size="9" font-family="monospace">.caBundle  ← from cert Secret</text>
  <text x="1142" y="316" font-size="9" font-family="monospace">.url       ← --external-host:port</text>
  <text x="1142" y="332" font-size="9" fill="#666" font-style="italic">applied directly by WebhookReconciler</text>

  <!-- CRD -->
  <rect x="800" y="360" width="620" height="110" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="1110" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">CustomResourceDefinition (conversion=Webhook)</text>
  <text x="1110" y="400" text-anchor="middle" font-size="9" fill="#666">cluster-scoped on the shoot</text>
  <text x="812" y="422" font-size="9" font-family="monospace">.spec.conversion.webhook.clientConfig.caBundle  ← stamped in MR Secret</text>
  <text x="812" y="438" font-size="9" font-family="monospace">.spec.conversion.webhook.clientConfig.url       ← Service→URL rewrite</text>
  <text x="812" y="458" font-size="9" fill="#666" font-style="italic">applied to the shoot by GRM, NOT directly by webhook-injector</text>

  <!-- dispatch hint -->
  <text x="1110" y="497" text-anchor="middle" font-size="11" font-weight="700">admission + conversion dispatch</text>
  <text x="800" y="513" font-size="10" fill="#222">• CR writes invoke MWC/VWC over HTTPS · cross-version reads invoke CRD conversion · all hit the in-namespace Service</text>

  <!-- ===== ROW 2: Cert Secret · ConfigMap · MR Secrets · Service ===== -->
  <rect x="60" y="565" width="180" height="130" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/>
  <text x="150" y="589" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Cert Secret</text>
  <text x="150" y="604" text-anchor="middle" font-size="9" fill="#666">type: kubernetes.io/tls</text>
  <text x="72" y="624" font-size="10" font-family="monospace">tls.crt</text>
  <text x="72" y="640" font-size="10" font-family="monospace">tls.key</text>
  <text x="72" y="656" font-size="10" font-family="monospace">tls.staged.key</text>
  <text x="170" y="656" font-size="9" fill="#666" font-style="italic">(staged)</text>
  <text x="72" y="678" font-size="9" fill="#666" font-style="italic">phase / force annots</text>

  <rect x="260" y="565" width="180" height="130" rx="10" fill="#fff" stroke="#374151" stroke-width="1.5"/>
  <text x="350" y="589" text-anchor="middle" font-size="13" font-weight="700">ConfigMap</text>
  <text x="350" y="604" text-anchor="middle" font-size="9" fill="#666">user-authored</text>
  <text x="272" y="626" font-size="10" font-family="monospace">data.webhooks.yaml:</text>
  <text x="272" y="644" font-size="9" fill="#444">  MWC + VWC docs,</text>
  <text x="272" y="658" font-size="9" fill="#444">  caBundle empty</text>
  <text x="272" y="680" font-size="9" fill="#666" font-style="italic">parsed by WebhookReconciler</text>

  <rect x="460" y="565" width="220" height="130" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="570" y="589" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">ManagedResource + Secret</text>
  <text x="570" y="604" text-anchor="middle" font-size="9" fill="#666">labeled selector</text>
  <text x="472" y="624" font-size="10" font-family="monospace">spec.secretRefs[] →</text>
  <text x="472" y="640" font-size="10" font-family="monospace">data[*.yaml(.br)]</text>
  <text x="472" y="654" font-size="9" fill="#444">embedded CRDs +</text>
  <text x="472" y="666" font-size="9" fill="#444">stamped caBundle</text>
  <text x="472" y="684" font-size="10" font-family="monospace" fill="#b91c1c">spec.keepObjects: true</text>
  <text x="619" y="684" font-size="9" fill="#b91c1c" font-style="italic">required</text>

  <!-- Service: lives in the "between Pods" corridor, x=730..900 ish, vertically aligned to span row 2 -->
  <rect x="730" y="565" width="200" height="130" rx="10" fill="#fff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="830" y="589" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">Service</text>
  <text x="830" y="604" text-anchor="middle" font-size="9" fill="#666">ClusterIP · :443</text>
  <text x="742" y="626" font-size="10" fill="#222">selects webhook-server Pod</text>
  <text x="742" y="646" font-size="9" font-family="monospace">name.ns.svc.cluster.local</text>
  <text x="742" y="664" font-size="9" font-family="monospace">name.ns.svc</text>
  <text x="742" y="684" font-size="9" fill="#666" font-style="italic">both names in cert SANs</text>

  <!-- ===== ROW 3: GRM Pod + Notes ===== -->
  <rect x="60" y="730" width="620" height="150" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="370" y="755" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Pod: gardener-resource-manager</text>
  <text x="370" y="772" text-anchor="middle" font-size="10" fill="#666">runs in this same namespace</text>
  <text x="78" y="795" font-size="11" fill="#222">• Reads labeled MR Secrets</text>
  <text x="78" y="813" font-size="11" fill="#222">• Decompresses .br, validates</text>
  <text x="78" y="831" font-size="11" fill="#222">• Applies CRDs into the shoot cluster (via shoot kubeconfig)</text>
  <text x="78" y="849" font-size="11" fill="#222">• Honours gardener.cloud/operation=reconcile annotation</text>
  <text x="78" y="871" font-size="10" fill="#9a3412" font-style="italic">stamps "DO NOT EDIT — managed by GRM" on every applied object</text>

  <!-- Notes -->
  <rect x="700" y="730" width="740" height="150" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="720" y="755" font-size="13" font-weight="700" fill="#111">Why a sidecar inside the apiserver's own namespace works</text>
  <text x="720" y="778" font-size="11" fill="#222">The shoot's kube-apiserver runs as a Pod in this seed namespace, beside webhook-server.</text>
  <text x="720" y="796" font-size="11" fill="#222">Admission and conversion dispatch resolve the Service over cluster DNS and reach</text>
  <text x="720" y="814" font-size="11" fill="#222">webhook-server directly — same Pod network, no cross-cluster routing.</text>
  <text x="720" y="838" font-size="11" fill="#222">webhook-injector generates a cert with that Service's SANs, writes it via shared</text>
  <text x="720" y="856" font-size="11" fill="#222">emptyDir, applies MWC/VWC directly, and stamps the same caBundle onto MR</text>
  <text x="720" y="874" font-size="11" fill="#15803d">Secrets — GRM then propagates the CRD stamp into the shoot.</text>

  <!-- ===== ARROWS =====
       Corridors:
         y=540..555 between row 1 (Pods) and row 2 (Secrets/Service)
         y=710..720 between row 2 and row 3 (GRM)
         x=720..760 between webhook-server Pod and apiserver Pod (vertical aisle)
  -->

  <!-- init container → ConfigMap (watch). Exit init at BOTTOM (220, 460),
       south to y=500 (free band inside Pod below containers), east through
       Pod boundary at (700, 500), continue east to x=350, south through
       y=540 corridor into ConfigMap top at (350, 565). -->
  <polyline points="220,460 220,500 350,500 350,565" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr-b)"/>
  <text x="232" y="495" font-size="10" fill="#1d4ed8">watch ConfigMap</text>

  <!-- init container → Cert Secret (generate/rotate). Exit init at LEFT side
       (80, 415), then west to x=45 (left corridor), south to y=550, east into
       Cert Secret top at (150, 565). -->
  <polyline points="80,415 45,415 45,550 150,550 150,565" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arr-o)"/>
  <text x="55" y="490" font-size="10" fill="#b45309" transform="rotate(-90 55 490)">generate / rotate</text>

  <!-- Cert Secret → init container (reloader watch). Same left corridor,
       slightly inside at x=33, going up from Cert Secret top to init left. -->
  <polyline points="150,565 150,548 33,548 33,395 80,395" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#arr-p)" stroke-dasharray="3 2"/>
  <text x="40" y="490" font-size="10" fill="#6d28d9" transform="rotate(-90 40 490)">reloader watch</text>

  <!-- init container → MR Secrets (watch labeled MRs + stamp). Same pattern:
       exit init at BOTTOM (260, 460), south to y=515 (just below ConfigMap
       arrow at y=500), east through Pod right wall, continue east to x=570,
       south into MR Secret top. -->
  <polyline points="260,460 260,515 570,515 570,565" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#arr-g)"/>
  <text x="272" y="510" font-size="10" fill="#15803d">watch labeled MRs + stamp</text>

  <!-- init container → MWC/VWC apply (cross-Pod). Both configs are written in
       the same Reconcile pass, so we draw one arrow into the apiserver Pod's
       top edge (between MWC and VWC) and the label covers both. Route via the
       narrow corridor at y=155 between namespace subtitle (y=138) and Pod top
       (y=170). -->
  <polyline points="220,170 220,155 1110,155 1110,170" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#arr-b)"/>
  <text x="660" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">apply MWC + VWC · inject caBundle</text>

  <!-- main container ↔ Service. Short dashed marker showing Service selects the Pod.
       Exit Service top at (830, 565), up to y=550 corridor west to x=680 (main container right edge), then up into main container at (680, 460). -->
  <polyline points="830,565 830,555 680,555 680,460" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="690" y="548" font-size="9" fill="#0891b2" font-style="italic">selects</text>

  <!-- MR Secrets → GRM (GRM reads). Exit MR Secret bottom (570, 695), south
       through the y=715 corridor, west into GRM top at (370, 730). -->
  <polyline points="570,695 570,715 370,715 370,730" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-r)"/>
  <text x="395" y="709" font-size="10" font-weight="700" fill="#b91c1c">GRM reads</text>

  <!-- GRM → shoot CRD. Exit GRM right-top at (680, 750), east through corridor
       at x=695, north up the side, then into the CRD bottom.
       Use the inter-Pod corridor on the right side: x=695 vertical from y=750
       up to y=470 (CRD bottom), east into CRD at (800, 470). -->
  <polyline points="680,755 695,755 695,470 800,470" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arr-r)"/>
  <text x="705" y="640" font-size="11" font-weight="700" fill="#b91c1c">apply CRDs to shoot</text>

  <!-- apiserver → Service (HTTPS dispatch). Exit apiserver bottom (1110, 530),
       south to y=550 corridor, west to Service top at (830, 565). -->
  <polyline points="900,530 900,555 830,555 830,565" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#arr-c)"/>
  <text x="838" y="548" font-size="11" font-weight="700" fill="#0891b2">HTTPS dispatch</text>
  <text x="838" y="563" font-size="9" font-style="italic" fill="#0891b2">apiserver → Service</text>
</svg>
